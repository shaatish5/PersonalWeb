<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume Portfolio</title>
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="#home" class="brand" id="nav-brand">Portfolio</a>
            <nav class="nav-links" aria-label="Primary Navigation">
                <a href="#home">Home</a>
                <a href="#about">About Me</a>
                <a href="#skills">Skills</a>
                <a href="#education">Education</a>
                <a href="#projects">Projects</a>
                <a href="login.html" class="nav-admin-link">Admin</a>
            </nav>
        </div>
    </header>

    <main>
        <!-- 1. Home Section -->
        <section id="home" class="hero-section">
            <div class="container hero-content">
                <p class="eyebrow" id="hero-location">Loading location...</p>
                <h1 id="hero-name">Loading profile...</h1>
                <p class="hero-headline" id="hero-headline"></p>
                <div class="hero-actions">
                    <a href="#projects" class="btn btn-primary">View Projects</a>
                    <a href="#about" class="btn btn-secondary">About Me</a>
                </div>
            </div>
        </section>

        <!-- 2. About Me Section -->
        <section id="about" class="section">
            <div class="container">
                <h2>About Me</h2>
                <div id="about-content" class="card">
                    <p class="muted">Loading About Me information...</p>
                </div>
            </div>
        </section>

        <!-- 3. Skills Section -->
        <section id="skills" class="section section-alt">
            <div class="container">
                <h2>Skills</h2>
                <div id="skills-content" class="skills-grid">
                    <p class="muted">Loading skills...</p>
                </div>
            </div>
        </section>

        <!-- 4. Education Section -->
        <section id="education" class="section">
            <div class="container">
                <h2>Education</h2>
                <div id="education-content" class="stack-list">
                    <p class="muted">Loading education history...</p>
                </div>
            </div>
        </section>

        <!-- 5. Projects Section -->
        <section id="projects" class="section section-alt">
            <div class="container">
                <h2>Projects</h2>
                <div id="projects-content" class="projects-grid">
                    <p class="muted">Loading projects...</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p id="footer-text">&copy; <span id="year"></span> Portfolio</p>
            <a href="login.html">Admin Login</a>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/public.js"></script>
</body>
</html>
